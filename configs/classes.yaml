# Unified component taxonomy for the detector.
#
# The detector predicts one of `classes`. Finer distinctions that only one
# dataset labels (NPN vs PNP, NMOS vs PMOS, bulk/cross variants) are kept as a
# `subtype` in the converted annotations so a crop classifier can learn them
# later; the detector itself stays coarse so both datasets agree.
#
# `source_map` maps each raw dataset label to [class, subtype]. A class of
# null drops the label (not a schematic component).

classes:
  - resistor
  - capacitor
  - inductor
  - diode
  - led
  - bjt
  - mosfet
  - opamp
  - ic_box          # IC or connector drawn as a rectangle with pins
  - ground
  - power           # supply symbol: VCC, 3V3, VDD, rail line
  - vsource
  - isource
  - port            # off-sheet / net-label port, I/O flag
  - terminal        # test point, single pin, round terminal
  - net_tie
  - no_connect
  - switch
  - crystal
  - fuse
  - battery
  - buzzer
  - antenna
  - transformer
  - jumper
  - mounting_hole
  - wire_hop        # curved crossing: wires cross WITHOUT connecting
  - other
  # added with CGHD + KiCad-rendered synthetic pages (appended: indices 0-27 unchanged)
  - and_gate
  - or_gate
  - nand_gate
  - nor_gate
  - xor_gate
  - xnor_gate
  - not_gate        # inverter (with bubble), incl. Schmitt inverters
  - buffer_gate     # buffer / tri-state buffer (no bubble on the output)
  - potentiometer
  - thyristor       # SCR
  - triac           # triac / diac
  - varistor
  - optocoupler
  - relay
  - speaker
  - microphone
  - motor
  - lamp
  - meter           # voltmeter / ammeter / probe

